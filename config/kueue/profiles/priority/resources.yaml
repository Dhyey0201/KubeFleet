{
  "apiVersion": "kueue.x-k8s.io/v1beta1",
  "kind": "ResourceFlavor",
  "metadata": {
    "name": "workers"
  },
  "spec": {
    "nodeLabels": {
      "batch.kubefleet.dev/pool": "workers"
    }
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Namespace",
  "metadata": {
    "name": "team-a",
    "labels": {
      "pod-security.kubernetes.io/enforce": "restricted",
      "batch.kubefleet.dev/project": "kubefleet"
    }
  }
}
---
{
  "apiVersion": "v1",
  "kind": "ServiceAccount",
  "metadata": {
    "name": "kubefleet-worker",
    "namespace": "team-a"
  },
  "automountServiceAccountToken": false
}
---
{
  "apiVersion": "kueue.x-k8s.io/v1beta1",
  "kind": "ClusterQueue",
  "metadata": {
    "name": "team-a"
  },
  "spec": {
    "namespaceSelector": {
      "matchLabels": {
        "kubernetes.io/metadata.name": "team-a"
      }
    },
    "queueingStrategy": "BestEffortFIFO",
    "resourceGroups": [
      {
        "coveredResources": [
          "cpu",
          "memory"
        ],
        "flavors": [
          {
            "name": "workers",
            "resources": [
              {
                "name": "cpu",
                "nominalQuota": "250m",
                "borrowingLimit": "500m",
                "lendingLimit": "250m"
              },
              {
                "name": "memory",
                "nominalQuota": "512Mi",
                "borrowingLimit": "1Gi",
                "lendingLimit": "512Mi"
              }
            ]
          }
        ]
      }
    ],
    "cohort": "kubefleet",
    "preemption": {
      "withinClusterQueue": "LowerPriority",
      "reclaimWithinCohort": "Any"
    },
    "admissionChecks": [
      "kubefleet-prerequisite"
    ]
  }
}
---
{
  "apiVersion": "kueue.x-k8s.io/v1beta1",
  "kind": "LocalQueue",
  "metadata": {
    "name": "team-a",
    "namespace": "team-a"
  },
  "spec": {
    "clusterQueue": "team-a"
  }
}
