apiVersion: batch.kubefleet.dev/v1alpha1
kind: BatchRun
metadata:
  name: smoke-sample
  namespace: team-a
spec:
  queueName: team-a
  image: kubefleet-worker:compat
  command: [/worker]
  args: [cpu, --duration=500ms, --seed=42]
  resources:
    requests: {cpu: 250m, memory: 64Mi}
    limits: {cpu: 250m, memory: 128Mi}
  totalTimeoutSeconds: 120
  executionTimeoutSeconds: 30
