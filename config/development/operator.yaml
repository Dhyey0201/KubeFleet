apiVersion: v1
kind: Namespace
metadata:
  name: kubefleet-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubefleet-manager
  namespace: kubefleet-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubefleet-manager
rules:
- apiGroups: [batch.kubefleet.dev]
  resources: [batchruns, prerequisitegatepolicies]
  verbs: [get, list, watch]
- apiGroups: [batch.kubefleet.dev]
  resources: [batchruns/status]
  verbs: [get, update, patch]
- apiGroups: [batch.kubefleet.dev]
  resources: [batchruns/finalizers]
  verbs: [update]
- apiGroups: [batch]
  resources: [jobs]
  verbs: [get, list, watch, create, delete]
- apiGroups: ['']
  resources: [pods]
  verbs: [get, list, watch]
- apiGroups: ['']
  resources: [events]
  verbs: [create, patch, update]
- apiGroups: [kueue.x-k8s.io]
  resources: [workloads, localqueues, clusterqueues, admissionchecks]
  verbs: [get, list, watch]
- apiGroups: [kueue.x-k8s.io]
  resources: [workloads/status, admissionchecks/status]
  verbs: [get, update, patch]
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubefleet-manager
subjects:
- kind: ServiceAccount
  name: kubefleet-manager
  namespace: kubefleet-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubefleet-manager
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: kubefleet-selfsigned
  namespace: kubefleet-system
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kubefleet-webhook
  namespace: kubefleet-system
spec:
  secretName: kubefleet-webhook-tls
  dnsNames:
  - kubefleet-webhook.kubefleet-system.svc
  - kubefleet-webhook.kubefleet-system.svc.cluster.local
  issuerRef:
    name: kubefleet-selfsigned
---
apiVersion: v1
kind: Service
metadata:
  name: kubefleet-webhook
  namespace: kubefleet-system
spec:
  selector:
    app: kubefleet-manager
  ports:
  - port: 443
    targetPort: 9443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubefleet-manager
  namespace: kubefleet-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubefleet-manager
  template:
    metadata:
      labels:
        app: kubefleet-manager
    spec:
      serviceAccountName: kubefleet-manager
      nodeSelector:
        kubernetes.io/hostname: kubefleet-control-plane
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        image: kubefleet-manager:dev
        imagePullPolicy: Never
        args:
        - --webhook-cert-dir=/certs
        - --development-local-image=kubefleet-worker:compat
        - --policy=default
        ports:
        - containerPort: 9443
        - containerPort: 8081
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: certs
          mountPath: /certs
          readOnly: true
      volumes:
      - name: certs
        secret:
          secretName: kubefleet-webhook-tls
