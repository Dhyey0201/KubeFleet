apiVersion: batch.kubefleet.dev/v1alpha1
kind: PrerequisiteGatePolicy
metadata:
  name: default
spec:
  allowedImageRegistries: [registry.example.test]
  allowedPriorityClassNames: [normal]
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: ResourceFlavor
metadata:
  name: default
spec:
  nodeLabels:
    batch.kubefleet.dev/pool: workers
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: WorkloadPriorityClass
metadata:
  name: normal
value: 0
---
apiVersion: v1
kind: Namespace
metadata:
  name: team-a
  labels:
    batch.kubefleet.dev/tenant: 'true'
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubefleet-worker
  namespace: team-a
automountServiceAccountToken: false
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: team-a
spec:
  admissionChecks: [kubefleet-prerequisite]
  queueingStrategy: BestEffortFIFO
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: team-a
  resourceGroups:
  - coveredResources: [cpu, memory]
    flavors:
    - name: default
      resources:
      - name: cpu
        nominalQuota: 250m
      - name: memory
        nominalQuota: 512Mi
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: LocalQueue
metadata:
  name: team-a
  namespace: team-a
spec:
  clusterQueue: team-a
---
