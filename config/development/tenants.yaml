apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubefleet-tenant
rules:
- apiGroups: [batch.kubefleet.dev]
  resources: [batchruns]
  verbs: [get, list, watch, create, update, patch]
- apiGroups: [batch]
  resources: [jobs]
  verbs: [get, list, watch]
- apiGroups: ['']
  resources: [pods, events]
  verbs: [get, list, watch]
- apiGroups: ['']
  resources: [pods/log]
  verbs: [get]
- apiGroups: [kueue.x-k8s.io]
  resources: [workloads, localqueues]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubefleet-global-diagnostics
rules:
- apiGroups: [kueue.x-k8s.io]
  resources: [clusterqueues, admissionchecks, resourceflavors]
  verbs: [get, list, watch]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubefleet-tenant
  namespace: team-a
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubefleet-tenant
  namespace: team-a
subjects:
- kind: ServiceAccount
  name: kubefleet-tenant
  namespace: team-a
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubefleet-tenant
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubefleet-tenant
  namespace: team-b
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubefleet-tenant
  namespace: team-b
subjects:
- kind: ServiceAccount
  name: kubefleet-tenant
  namespace: team-b
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubefleet-tenant
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubefleet-tenant
  namespace: team-c
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubefleet-tenant
  namespace: team-c
subjects:
- kind: ServiceAccount
  name: kubefleet-tenant
  namespace: team-c
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubefleet-tenant
